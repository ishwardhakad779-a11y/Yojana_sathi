name: CI

on:
  push:
    branches: [ main, fix-routing ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ingest RAG Vector DB
      run: |
        python -m app.rag.ingest

    - name: Run Unit Tests
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'dummy_test_key' }}
      run: |
        pytest tests/ -v --tb=short

    - name: Run Smoke Tests & Healthcheck
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'dummy_test_key' }}
      run: |
        python -c "
        from fastapi.testclient import TestClient
        from app.main import app
        client = TestClient(app)
        r = client.get('/health')
        assert r.status_code == 200, f'Health failed: {r.status_code}'
        rz = client.get('/healthz')
        assert rz.status_code == 200, f'Deep health failed: {rz.status_code}'
        print('All CI health checks passed successfully!')
        "

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Check for secrets with TruffleHog
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --only-verified
