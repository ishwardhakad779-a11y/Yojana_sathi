name: CI

on:
  push:
    branches: [ main, fix-routing ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest httpx

    - name: Ingest RAG Vector DB
      run: |
        python -m app.rag.ingest

    - name: Run Smoke Tests & Healthcheck
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'dummy_test_key' }}
      run: |
        python -c "
        from fastapi.testclient import TestClient
        from app.main import app
        client = TestClient(app)
        r = client.get('/health')
        assert r.status_code == 200, f'Health failed: {r.status_code}'
        rz = client.get('/healthz')
        assert rz.status_code == 200, f'Deep health failed: {rz.status_code}'
        print('All CI health checks passed successfully!')
        "
